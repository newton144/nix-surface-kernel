name: Build Template

on:
  workflow_dispatch: {}
  workflow_call:
    inputs: {}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-success: ${{ steps.build-result.outputs.success }}
    steps:
      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h
          
          # Remove large packages that exist
          packages_to_remove=(
            azure-cli
            google-chrome-stable
            firefox
            powershell
            mono-devel
          )
          
          #for pkg in "${packages_to_remove[@]}"; do
            #if dpkg -l | grep -q "^ii  $pkg "; then
              #echo "Removing $pkg..."
              #sudo apt-get remove -y "$pkg" || true
            #fi
          #done
          
          # Remove packages by pattern (ignore errors for missing packages)
          #sudo apt-get remove -y '^ghc-.*' 2>/dev/null || true
          #sudo apt-get remove -y '^dotnet-.*' 2>/dev/null || true  
          #sudo apt-get remove -y '^llvm-.*' 2>/dev/null || true
          
          #sudo apt-get autoremove -y
          #sudo apt-get clean
          
          # Remove large directories
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          
          echo "Disk usage after cleanup:"
          df -h

          #sudo rm -rf /usr/share /usr/local /opt || true

          #echo "Disk usage after cleanup:"
          #df -h

      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          name: newton144-nix-surface
          # signingKey: ' secrets.CACHIX_SIGNING_KEY '
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          cachixArgs: '-v'
      - run: nix flake check
