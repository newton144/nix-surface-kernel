name: Build Template

on:
  workflow_call:
    inputs:
      template:
        required: true
        type: string
      arch:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-success: ${{ steps.build-result.outputs.success }}
    steps:
      # - name: Checkout repository
      #   uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h
          
          # Remove large packages that exist
          packages_to_remove=(
            azure-cli
            google-chrome-stable
            firefox
            powershell
            mono-devel
          )
          
          for pkg in "${packages_to_remove[@]}"; do
            if dpkg -l | grep -q "^ii  $pkg "; then
              echo "Removing $pkg..."
              sudo apt-get remove -y "$pkg" || true
            fi
          done
          
          # Remove packages by pattern (ignore errors for missing packages)
          sudo apt-get remove -y '^ghc-.*' 2>/dev/null || true
          sudo apt-get remove -y '^dotnet-.*' 2>/dev/null || true  
          sudo apt-get remove -y '^llvm-.*' 2>/dev/null || true
          
          sudo apt-get autoremove -y
          sudo apt-get clean
          
          # Remove large directories
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          
          echo "Disk usage after cleanup:"
          df -h

          #sudo rm -rf /usr/share /usr/local /opt || true

          #echo "Disk usage after cleanup:"
          #df -h

      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v17
        with:
          name: e-surface
          # If you chose signing key for write access
          # signingKey: ' secrets.CACHIX_SIGNING_KEY '
          # If you chose API tokens for write access OR if you have a private cache
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#nixosConfigurations.nixpad.config.system.build.toplevel


